<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#a371f7" />
      <stop offset="100%" stop-color="#f778ba" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: url(#titleGradient);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #8b949e;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
      }

      /* Animated floating background elements */
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-1.5deg); }
      }
      @keyframes float3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 0.8; transform: scale(1.1); }
      }

      .float-card-1 {
        animation: float1 7s ease-in-out infinite;
      }
      .float-card-2 {
        animation: float2 8s ease-in-out infinite;
      }
      .float-card-3 {
        animation: float3 6s ease-in-out infinite;
      }
      .pulsing-dot {
        animation: pulseDot 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" stroke="#30363d" stroke-width="1.5" />

  <!-- Background Grid Pattern -->
  <g opacity="0.12">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" stroke="#8b949e" stroke-width="1" stroke-dasharray="4,6" />
    <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360" stroke="#8b949e" stroke-width="1" stroke-dasharray="4,6" />
  </g>

  <!-- Glowing background orbs -->
  <circle cx="200" cy="90" r="130" fill="url(#glowGrad)" filter="url(#glow)" />
  <circle cx="1020" cy="270" r="150" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- Animated Background Cards (Positioned in corners/sides to avoid overlapping main foreground text) -->
  <!-- Left Side Dynamic Pill -->
  <g class="float-card-1">
    <g transform="translate(50, 45)">
      <rect width="190" height="44" rx="22" fill="#161b22" stroke="#388bfd" stroke-width="1.2" opacity="0.85" />
      <circle cx="22" cy="22" r="7" fill="#388bfd" />
      <text x="38" y="27" class="badge-text" fill="#c9d1d9">⚡ AI Deflection</text>
    </g>
  </g>

  <!-- Right Side Upper Card -->
  <g class="float-card-2">
    <g transform="translate(960, 45)">
      <rect width="195" height="44" rx="22" fill="#161b22" stroke="#a371f7" stroke-width="1.2" opacity="0.85" />
      <circle cx="22" cy="22" r="7" fill="#a371f7" />
      <text x="38" y="27" class="badge-text" fill="#c9d1d9">📚 Verified Runbooks</text>
    </g>
  </g>

  <!-- Bottom Left Dynamic Pill -->
  <g class="float-card-3">
    <g transform="translate(70, 275)">
      <rect width="180" height="44" rx="22" fill="#161b22" stroke="#3fb950" stroke-width="1.2" opacity="0.85" />
      <circle cx="22" cy="22" r="7" fill="#3fb950" />
      <text x="38" y="27" class="badge-text" fill="#c9d1d9">🚀 Self-Service Portals</text>
    </g>
  </g>

  <!-- Bottom Right Dynamic Pill -->
  <g class="float-card-1">
    <g transform="translate(950, 275)">
      <rect width="190" height="44" rx="22" fill="#161b22" stroke="#f778ba" stroke-width="1.2" opacity="0.85" />
      <circle cx="22" cy="22" r="7" fill="#f778ba" />
      <text x="38" y="27" class="badge-text" fill="#c9d1d9">📖 Docs-as-Code</text>
    </g>
  </g>

  <!-- Foreground Main Content Container -->
  <!-- Header Tag / Pill -->
  <g transform="translate(440, 65)">
    <rect width="320" height="32" rx="16" fill="#21262d" stroke="#388bfd" stroke-width="1" />
    <circle cx="20" cy="16" r="5" fill="#388bfd" class="pulsing-dot" />
    <text x="34" y="21" class="badge-text" fill="#58a6ff">CURATED KNOWLEDGE ECOSYSTEM</text>
  </g>

  <!-- Main Title (Foreground) -->
  <text x="600" y="160" text-anchor="middle" class="title-text">Knowledge Base &amp; FAQ Management</text>

  <!-- Subtitle Line 1 (Foreground) -->
  <text x="600" y="206" text-anchor="middle" class="subtitle-text">The Definitive Guide to Internal Team Wikis, Customer Help Centers &amp; Self-Service Portals</text>

  <!-- Subtitle Line 2 (Foreground) -->
  <g transform="translate(350, 235)">
    <text x="250" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#58a6ff">
      • SaaS Leaders &amp; Market Dynamics  • Top-Starred Open-Source Engines  • Decision Archetypes
    </text>
  </g>
</svg>